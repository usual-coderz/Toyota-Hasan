<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #050505;
            color: #fff;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
        }

        .background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(0, 0, 0, 0.72),
                rgba(0, 0, 0, 0.35),
                rgba(0, 0, 0, 0.78)
            );
            backdrop-filter: blur(3px);
        }

        .login-container {
            width: 90%;
            max-width: 410px;
            padding: 40px 32px;
            background: rgba(15, 15, 20, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 22px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            font-size: 27px;
            font-weight: bold;
            box-shadow: 0 0 35px rgba(124, 58, 237, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            letter-spacing: -0.8px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b6b6c5;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 19px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #e0e0e8;
            margin-bottom: 9px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            background: rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #858592;
        }

        .input-group input:focus {
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 5px 0 24px;
            font-size: 12px;
            color: #c5c5d0;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .remember input {
            accent-color: #8b5cf6;
        }

        a {
            color: #b59aff;
            text-decoration: none;
        }

        a:hover {
            color: #d1c2ff;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5cf6, #5b4bdb);
            box-shadow: 0 8px 25px rgba(91, 75, 219, 0.3);
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(91, 75, 219, 0.45);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .signup {
            text-align: center;
            font-size: 13px;
            color: #b6b6c5;
            margin-top: 25px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #888895;
            font-size: 11px;
            margin: 23px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
        }

        .footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 34px 24px;
            }

            h1 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-container {
                animation: none;
            }

            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="https://files.catbox.moe/zp6wxp.mp4" type="video/mp4">
        </video>
    </div>

    <main class="login-container">
        <div class="logo">N</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue to your account.</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
                Sign In →
            </button>
        </form>

        <div class="divider">SECURE LOGIN</div>

        <p class="signup">
            Don't have an account? <a href="#" id="signupLink">Create account</a>
        </p>
    </main>

    <div class="footer">
        © 2026 YOUR BRAND · ALL RIGHTS RESERVED
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            alert("Connect this form to your backend authentication API to enable login.");
        });

        document.getElementById("forgotPassword").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Connect your password recovery page here.");
        });

        document.getElementById("signupLink").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Connect your registration page here.");
        });
    </script>

</body>
</html>
