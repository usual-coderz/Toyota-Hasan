<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>Access Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --accent: #a7f3d0;
    --accent-strong: #5eead4;
    --text: #f8fafc;
    --muted: #c0c9d5;
    --border: rgba(255,255,255,.19);
    --glass: rgba(12,18,28,.48);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px 16px 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    overflow-y: auto;
    background: #080b12;
    color: var(--text);
    font-family: "DM Sans", sans-serif;
}

/* FULL-SCREEN VIDEO */

.video-background {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    background: #080b12;
}

.video-background video {
    position: absolute;
    width: 100%;
    height: 100%;
    inset: 0;
    object-fit: cover;
    object-position: center;
}

/* Minimal overlay keeps the video visible */

.video-background::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            180deg,
            rgba(4,8,15,.12) 0%,
            rgba(4,8,15,.24) 48%,
            rgba(4,8,15,.48) 100%
        );
}

/* DECORATIVE LIGHTING */

.ambient {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at 15% 15%,
            rgba(45,212,191,.12),
            transparent 42%
        ),
        radial-gradient(
            ellipse at 90% 85%,
            rgba(139,92,246,.12),
            transparent 40%
        );
}

/* MAIN LAYOUT */

.page {
    width: 100%;
    max-width: 430px;
    margin: auto;
    animation: enter .75s cubic-bezier(.2,.7,.2,1) both;
}

@keyframes enter {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.brand {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 11px;
    margin-bottom: 23px;
}

.brand-mark {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    color: #071512;
    font-family: "Manrope", sans-serif;
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(145deg, #d1fae5, #5eead4);
    box-shadow: 0 0 32px rgba(94,234,212,.2);
}

.brand-name {
    font-family: "Manrope", sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 15px #000;
}

/* GLASS CARD */

.login-card {
    position: relative;
    padding: 35px 32px 29px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 27px;
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
        0 30px 100px rgba(0,0,0,.32),
        inset 0 1px 0 rgba(255,255,255,.10);
}

.login-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(167,243,208,.8),
        transparent
    );
}

.eyebrow {
    display: flex;
    justify-content: center;
    margin-bottom: 17px;
}

.status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid rgba(167,243,208,.25);
    border-radius: 50px;
    background: rgba(94,234,212,.08);
    color: #c7f9e5;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-strong);
    box-shadow: 0 0 12px rgba(94,234,212,.8);
}

h1 {
    font-family: "Manrope", sans-serif;
    text-align: center;
    font-size: clamp(29px, 7vw, 36px);
    font-weight: 800;
    letter-spacing: -1.6px;
    line-height: 1.2;
}

.heading-highlight {
    color: var(--accent);
}

.subtitle {
    max-width: 280px;
    margin: 12px auto 27px;
    color: #e0e7ef;
    font-size: 13px;
    line-height: 1.8;
    text-align: center;
}

/* FORM */

.form-group {
    margin-bottom: 19px;
}

.form-group label {
    display: block;
    margin-bottom: 9px;
    color: #f1f5f9;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2px;
}

.input-wrap {
    position: relative;
}

.input-icon {
    position: absolute;
    top: 50%;
    left: 15px;
    width: 19px;
    height: 19px;
    transform: translateY(-50%);
    color: #c1d0dc;
    pointer-events: none;
}

.form-input {
    width: 100%;
    min-height: 53px;
    padding: 15px 15px 15px 45px;
    outline: none;
    border: 1px solid rgba(255,255,255,.21);
    border-radius: 13px;
    background: rgba(5,10,17,.40);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    transition: border-color .25s, background .25s, box-shadow .25s;
}

.form-input::placeholder {
    color: rgba(231,238,246,.63);
}

.form-input:focus {
    border-color: rgba(167,243,208,.85);
    background: rgba(5,10,17,.65);
    box-shadow: 0 0 0 3px rgba(94,234,212,.10);
}

.form-input:-webkit-autofill,
.form-input:-webkit-autofill:hover,
.form-input:-webkit-autofill:focus {
    -webkit-text-fill-color: white;
    transition: background-color 9999s ease-in-out 0s;
}

/* OPTIONS */

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 4px 0 23px;
    font-size: 11px;
}

.remember {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #e5eaf1;
    cursor: pointer;
}

.remember input {
    width: 14px;
    height: 14px;
    accent-color: #5eead4;
}

a {
    color: var(--accent);
    text-decoration: none;
}

a:hover {
    color: #fff;
}

/* BUTTON */

.submit-btn {
    position: relative;
    width: 100%;
    min-height: 54px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 15px;
    border: 1px solid rgba(255,255,255,.23);
    border-radius: 13px;
    background: linear-gradient(120deg, #d1fae5, #5eead4);
    color: #09201a;
    font-family: "Manrope", sans-serif;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(45,212,191,.13);
    transition: transform .2s, box-shadow .2s;
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(45,212,191,.25);
}

.submit-btn:active {
    transform: scale(.99);
}

.submit-btn:disabled {
    opacity: .65;
    cursor: wait;
    transform: none;
}

.arrow {
    font-size: 19px;
    line-height: 1;
}

/* STATUS MESSAGES */

.message {
    display: none;
    margin-top: 17px;
    padding: 13px 14px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    background: rgba(0,0,0,.25);
    color: #f1f5f9;
    font-size: 12px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.message.visible {
    display: block;
    animation: enter .25s ease both;
}

.message.error {
    border-color: rgba(252,165,165,.4);
    background: rgba(127,29,29,.28);
    color: #fecaca;
}

.message.success {
    border-color: rgba(167,243,208,.35);
    background: rgba(6,78,59,.30);
    color: #d1fae5;
}

.message.info {
    border-color: rgba(147,197,253,.3);
    background: rgba(30,58,138,.25);
    color: #dbeafe;
}

.signup {
    margin-top: 23px;
    color: #e0e7ef;
    font-size: 12px;
    text-align: center;
    line-height: 1.8;
}

.signup a {
    font-weight: 700;
}

/* BOTTOM SECURITY LABEL */

.security {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    color: rgba(255,255,255,.86);
    font-size: 10px;
    letter-spacing: .35px;
    text-shadow: 0 2px 10px #000;
}

.security svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    color: var(--accent);
}

.footer {
    position: fixed;
    right: 12px;
    bottom: 13px;
    left: 12px;
    color: rgba(255,255,255,.76);
    font-size: 9px;
    text-align: center;
    letter-spacing: 1.2px;
    text-shadow: 0 2px 10px #000;
    pointer-events: none;
}

/* SMALL SCREENS */

@media (max-width: 480px) {
    body {
        padding: 25px 16px 55px;
    }

    .login-card {
        padding: 30px 23px 25px;
        border-radius: 23px;
    }

    .brand {
        margin-bottom: 20px;
    }

    .subtitle {
        margin-bottom: 24px;
    }

    .footer {
        font-size: 8px;
    }
}

@media (max-height: 700px) {
    body {
        align-items: flex-start;
    }

    .page {
        margin: 15px auto;
    }

    .brand {
        margin-bottom: 14px;
    }

    .login-card {
        padding-top: 25px;
        padding-bottom: 22px;
    }

    .subtitle {
        margin-bottom: 20px;
    }

    .footer {
        position: static;
        margin-top: 15px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="video-background" aria-hidden="true">
    <video
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster=""
    >
        <source src="{{ bg_video }}" type="video/mp4">
        <source src="https://files.catbox.moe/zp6wxp.mp4" type="video/mp4">
    </video>
</div>

<div class="ambient" aria-hidden="true"></div>

<main class="page">

    <div class="brand">
        <div class="brand-mark">A</div>
        <div class="brand-name">Aurora Access</div>
    </div>

    <section class="login-card">

        <div class="eyebrow">
            <div class="status-pill">
                <span class="status-dot"></span>
                Secure Member Portal
            </div>
        </div>

        <h1>
            Welcome <span class="heading-highlight">back.</span>
        </h1>

        <p class="subtitle">
            Sign in to your account and continue where you left off.
        </p>

        <form id="loginForm" autocomplete="on">

            <div class="form-group">
                <label for="email">Email address</label>

                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.7" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="3"/>
                        <path d="m4 7 8 6 8-6"/>
                    </svg>

                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor"
                         stroke-width="1.7" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="3"/>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        <path d="M12 14v3"/>
                    </svg>

                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="/forgot-password">Forgot password?</a>
            </div>

            <button class="submit-btn" type="submit" id="submitBtn">
                <span id="buttonText">Sign in securely</span>
                <span class="arrow" aria-hidden="true">↗</span>
            </button>

            <div
                class="message"
                id="statusMessage"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <p class="signup">
            New here?
            <a href="/register">Create an account</a>
        </p>

    </section>

    <div class="security">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>Secure connection · Your privacy matters</span>
    </div>

</main>

<div class="footer">
    © 2026 AURORA ACCESS · ALL RIGHTS RESERVED
</div>

<script>
const form = document.getElementById("loginForm");
const statusMessage = document.getElementById("statusMessage");
const submitBtn = document.getElementById("submitBtn");
const buttonText = document.getElementById("buttonText");

function showMessage(text, type = "info") {
    statusMessage.textContent = text;
    statusMessage.className = "message visible " + type;
}

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (!form.reportValidity()) return;

    submitBtn.disabled = true;
    buttonText.textContent = "Signing in...";
    statusMessage.className = "message";

    try {
        /*
         * Connect your own authentication backend here.
         *
         * Expected example endpoint:
         * POST /api/login
         *
         * The server should validate credentials securely,
         * apply rate limiting and create a secure session.
         */

        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                remember: document.getElementById("remember").checked
            })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            showMessage(
                result.message || "Unable to sign in. Check your credentials and try again.",
                "error"
            );
            return;
        }

        if (result.success) {
            showMessage("Signed in successfully. Redirecting...", "success");

            window.location.assign(
                typeof result.redirect === "string" &&
                result.redirect.startsWith("/") &&
                !result.redirect.startsWith("//")
                    ? result.redirect
                    : "/dashboard"
            );
        } else {
            showMessage(
                result.message || "Sign-in unsuccessful. Please try again.",
                "error"
            );
        }

    } catch (error) {
        showMessage(
            "Unable to connect to the server. Please try again shortly.",
            "error"
        );
    } finally {
        submitBtn.disabled = false;
        buttonText.textContent = "Sign in securely";
    }
});
</script>

</body>
</html>
