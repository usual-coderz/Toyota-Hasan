<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  .game-wrapper {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    padding: 20px;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,255,136,0.05);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 6px;
  }
  .score-box {
    background: #0f0f23;
    padding: 8px 18px;
    border-radius: 40px;
    border: 1px solid rgba(0,255,136,0.25);
    color: #00ff88;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.5px;
  }
  .score-box span { color: #fff; margin-right: 6px; }
  .high-score { background: #0f0f23; padding: 8px 18px; border-radius: 40px; border: 1px solid rgba(255,215,0,0.25); color: #ffd700; font-weight: 700; font-size: 18px; }
  .high-score span { color: #fff; margin-right: 6px; }
  canvas {
    display: block;
    width: 450px;
    height: 450px;
    border-radius: 16px;
    background: #0f0f23;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
    touch-action: none;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: #1a1a3e;
    border: 1px solid #2a2a5e;
    color: #88ffbb;
    width: 60px;
    height: 60px;
    border-radius: 16px;
    font-size: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: all 0.12s;
    box-shadow: 0 4px 0 #0a0a1a;
  }
  .ctrl-btn:active { transform: translateY(4px); box-shadow: none; background: #2a2a5e; }
  .ctrl-row { display: flex; gap: 12px; justify-content: center; width: 100%; }
  .ctrl-grid { display: grid; grid-template-columns: 60px 60px 60px; gap: 8px; }
  .ctrl-grid .empty { visibility: hidden; }
  .restart-btn {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    border: none;
    color: #0a0a1a;
    padding: 10px 28px;
    border-radius: 40px;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(0,255,136,0.3);
  }
  .restart-btn:hover { transform: scale(1.04); box-shadow: 0 6px 30px rgba(0,255,136,0.5); }
  .status {
    text-align: center;
    margin-top: 12px;
    color: #667;
    font-size: 14px;
    letter-spacing: 1px;
  }
  @media (max-width: 520px) {
    .game-wrapper { padding: 12px; border-radius: 16px; }
    canvas { width: calc(100vw - 40px); height: calc(100vw - 40px); }
    .ctrl-btn { width: 52px; height: 52px; font-size: 22px; }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <div class="score-box"><span>SCORE</span> <span id="score">0</span></div>
    <div class="high-score"><span>🏆</span> <span id="highScore">0</span></div>
  </div>
  <canvas id="gameCanvas" width="450" height="450"></canvas>
  <div class="controls">
    <div class="ctrl-grid">
      <div class="empty"></div>
      <button class="ctrl-btn" data-dir="up">▲</button>
      <div class="empty"></div>
      <button class="ctrl-btn" data-dir="left">◀</button>
      <button class="ctrl-btn" data-dir="down">▼</button>
      <button class="ctrl-btn" data-dir="right">▶</button>
    </div>
  </div>
  <div style="text-align:center; margin-top:10px;">
    <button class="restart-btn" id="restartBtn">↻ NEW GAME</button>
  </div>
  <div class="status" id="status">Arrow keys / WASD to move</div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');

    const GRID_SIZE = 15;          // 15x15 grid
    const CELL_SIZE = canvas.width / GRID_SIZE;
    const TICK_MS = 150;

    let snake = [];
    let food = {};
    let direction = 'right';
    let nextDirection = 'right';
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
    let gameOver = false;
    let gameWin = false;
    let gameLoop = null;
    let isRunning = false;
    let isPaused = false;

    // Colors
    const COLORS = {
      bg: '#0f0f23',
      grid: '#15153a',
      snakeHead: '#00ff88',
      snakeBody: '#00cc6a',
      snakeTail: '#00994d',
      food: '#ff4466',
      foodGlow: 'rgba(255,68,102,0.3)',
      text: '#fff',
    };

    highScoreEl.textContent = highScore;

    // ---- Init ----
    function init() {
      const mid = Math.floor(GRID_SIZE / 2);
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid },
      ];
      direction = 'right';
      nextDirection = 'right';
      score = 0;
      gameOver = false;
      gameWin = false;
      isPaused = false;
      scoreEl.textContent = '0';
      statusEl.textContent = 'Playing...';
      spawnFood();
      draw();
    }

    // ---- Food ----
    function spawnFood() {
      const totalCells = GRID_SIZE * GRID_SIZE;
      if (snake.length >= totalCells) {
        gameWin = true;
        gameOver = true;
        stopLoop();
        statusEl.textContent = '🎉 YOU WIN! PERFECT!';
        return;
      }
      const snakeSet = new Set(snake.map(c => `${c.x},${c.y}`));
      const free = [];
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          if (!snakeSet.has(`${x},${y}`)) free.push({ x, y });
        }
      }
      if (free.length === 0) {
        gameWin = true;
        gameOver = true;
        stopLoop();
        statusEl.textContent = '🎉 YOU WIN! PERFECT!';
        return;
      }
      food = free[Math.floor(Math.random() * free.length)];
    }

    // ---- Drawing ----
    function draw() {
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // Food glow
      const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
      const grad = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL_SIZE * 1.2);
      grad.addColorStop(0, COLORS.foodGlow);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(food.x * CELL_SIZE - CELL_SIZE * 0.6, food.y * CELL_SIZE - CELL_SIZE * 0.6, CELL_SIZE * 2.2, CELL_SIZE * 2.2);

      // Food
      ctx.fillStyle = COLORS.food;
      ctx.shadowColor = COLORS.food;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL_SIZE * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const px = seg.x * CELL_SIZE;
        const py = seg.y * CELL_SIZE;
        const pad = i === 0 ? 2 : 3;
        const radius = 4;

        if (i === 0) {
          ctx.fillStyle = gameOver ? '#ff4466' : COLORS.snakeHead;
          ctx.shadowColor = gameOver ? '#ff4466' : COLORS.snakeHead;
          ctx.shadowBlur = 16;
        } else {
          const t = i / snake.length;
          ctx.fillStyle = lerpColor(COLORS.snakeBody, COLORS.snakeTail, t);
          ctx.shadowBlur = 0;
        }

        // Rounded rect
        const w = CELL_SIZE - pad * 2;
        ctx.beginPath();
        ctx.moveTo(px + pad + radius, py + pad);
        ctx.lineTo(px + pad + w - radius, py + pad);
        ctx.quadraticCurveTo(px + pad + w, py + pad, px + pad + w, py + pad + radius);
        ctx.lineTo(px + pad + w, py + pad + w - radius);
        ctx.quadraticCurveTo(px + pad + w, py + pad + w, px + pad + w - radius, py + pad + w);
        ctx.lineTo(px + pad + radius, py + pad + w);
        ctx.quadraticCurveTo(px + pad, py + pad + w, px + pad, py + pad + w - radius);
        ctx.lineTo(px + pad, py + pad + radius);
        ctx.quadraticCurveTo(px + pad, py + pad, px + pad + radius, py + pad);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        // Eyes on head
        if (i === 0 && !gameOver) {
          ctx.fillStyle = '#0a0a1a';
          const eyeSize = 3.5;
          let ex1, ey1, ex2, ey2;
          const cx = px + CELL_SIZE / 2;
          const cy = py + CELL_SIZE / 2;
          if (direction === 'right') {
            ex1 = cx + 5; ey1 = cy - 6; ex2 = cx + 5; ey2 = cy + 6;
          } else if (direction === 'left') {
            ex1 = cx - 5; ey1 = cy - 6; ex2 = cx - 5; ey2 = cy + 6;
          } else if (direction === 'up') {
            ex1 = cx - 6; ey1 = cy - 5; ex2 = cx + 6; ey2 = cy - 5;
          } else {
            ex1 = cx - 6; ey1 = cy + 5; ex2 = cx + 6; ey2 = cy + 5;
          }
          ctx.beginPath(); ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(ex1 + 1, ey1 - 1, 1.2, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(ex2 + 1, ey2 - 1, 1.2, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    function lerpColor(c1, c2, t) {
      const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
      const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const b = Math.round(b1 + (b2 - b1) * t);
      return `rgb(${r},${g},${b})`;
    }

    // ---- Game Logic ----
    function step() {
      if (gameOver || isPaused) return;

      direction = nextDirection;

      const head = { ...snake[0] };
      switch (direction) {
        case 'up':    head.y--; break;
        case 'down':  head.y++; break;
        case 'left':  head.x--; break;
        case 'right': head.x++; break;
      }

      // Wall wrap
      if (head.x < 0) head.x = GRID_SIZE - 1;
      if (head.x >= GRID_SIZE) head.x = 0;
      if (head.y < 0) head.y = GRID_SIZE - 1;
      if (head.y >= GRID_SIZE) head.y = 0;

      // Self collision
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver = true;
          stopLoop();
          statusEl.textContent = '💀 GAME OVER';
          if (score > highScore) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.textContent = highScore;
            statusEl.textContent = '🏆 NEW HIGH SCORE!';
          }
          draw();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        spawnFood();
        if (gameOver) return; // win condition triggered inside spawnFood
      } else {
        snake.pop();
      }

      draw();
    }

    function startLoop() {
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(step, TICK_MS);
      isRunning = true;
    }

    function stopLoop() {
      if (gameLoop) {
        clearInterval(gameLoop);
        gameLoop = null;
      }
      isRunning = false;
    }

    // ---- Restart ----
    function restart() {
      stopLoop();
      init();
      startLoop();
    }

    // ---- Input ----
    function setDirection(dir) {
      const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
      if (dir !== opposites[direction] && dir !== direction) {
        nextDirection = dir;
      }
    }

    document.addEventListener('keydown', (e) => {
      const keyMap = {
        ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
        w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right',
      };
      const dir = keyMap[e.key];
      if (dir) {
        e.preventDefault();
        if (gameOver) { restart(); return; }
        setDirection(dir);
      }
    });

    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const dir = btn.dataset.dir;
        if (gameOver) { restart(); return; }
        setDirection(dir);
      });
      // Prevent default on touch
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const dir = btn.dataset.dir;
        if (gameOver) { restart(); return; }
        setDirection(dir);
      });
    });

    // Touch swipe on canvas
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (!touchStartX || !touchStartY) return;
      const rect = canvas.getBoundingClientRect();
      const endX = touchStartX + (e.changedTouches[0].clientX - touchStartX);
      const endY = touchStartY + (e.changedTouches[0].clientY - touchStartY);
      const dx = endX - touchStartX;
      const dy = endY - touchStartY;
      const minSwipe = 20;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipe) {
        if (gameOver) { restart(); return; }
        setDirection(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > minSwipe) {
        if (gameOver) { restart(); return; }
        setDirection(dy > 0 ? 'down' : 'up');
      }
      touchStartX = 0; touchStartY = 0;
    }, { passive: false });

    restartBtn.addEventListener('click', restart);
    restartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); restart(); });

    // ---- Start ----
    init();
    startLoop();
  })();
</script>
</body>
</html>
