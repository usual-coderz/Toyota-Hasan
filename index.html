<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welcome Back</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #000;
            overflow: hidden;
        }

        .background video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.12);
            pointer-events: none;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 36px 30px;
            background: rgba(10, 10, 15, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 17px;
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.35);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #e0e0e0;
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 9px;
            color: #fff;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(0, 0, 0, 0.28);
            transition: 0.25s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .input-group input:focus {
            border-color: #a78bfa;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 5px 0 22px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #f0f0f0;
        }

        .remember input {
            accent-color: #8b5cf6;
        }

        a {
            color: #c4b5fd;
            text-decoration: none;
        }

        a:hover {
            color: #fff;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5cf6, #5b4bdb);
            transition: 0.25s;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(91, 75, 219, 0.4);
        }

        .signup {
            text-align: center;
            font-size: 13px;
            color: #eee;
            margin-top: 24px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ddd;
            font-size: 10px;
            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(255, 255, 255, 0.25);
        }

        .footer {
            position: fixed;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 10px;
            letter-spacing: 1px;
            text-shadow: 0 1px 5px #000;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 23px;
            }

            h1 {
                font-size: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-container {
                animation: none;
            }

            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="https://files.catbox.moe/zp6wxp.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
    </div>

    <main class="login-container">

        <div class="logo">N</div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue to your account.</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
                Sign In →
            </button>

        </form>

        <div class="divider">SECURE LOGIN</div>

        <p class="signup">
            Don't have an account?
            <a href="#" id="signupLink">Create account</a>
        </p>

    </main>

    <div class="footer">
        © 2026 YOUR BRAND · ALL RIGHTS RESERVED
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();
            alert("Connect your backend authentication API to enable login.");
        });

        document.getElementById("forgotPassword").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Connect your password recovery page here.");
        });

        document.getElementById("signupLink").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Connect your registration page here.");
        });
    </script>

</body>
</html>
